<style>
.fg{fill:#0b0b0c}.soft{fill:#3d3d42}.muted{fill:#63636b}.faint{fill:#9a9aa1}.accent{fill:#2d5cff}
.panel{fill:#f4f4f1}.green{fill:#128a4b}.btn{fill:#0b0b0c}.btnfg{fill:#fbfbfa}.btn2{fill:#f0f0ed}.paper{fill:#f6f6f3}.strip{fill:#ecece8}.chip{fill:#e6e6e1}
.s-accent{stroke:#2d5cff}.s-muted{stroke:#63636b}.s-fg{stroke:#0b0b0c}.s-line{stroke:#d5d5d0}.s-btnfg{stroke:#fbfbfa}
.ico{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.in{animation:rise .7s cubic-bezier(0.16,1,0.3,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.lt{animation:letter .7s cubic-bezier(0.16,1,0.3,1) both}
@keyframes letter{from{opacity:0;transform:translateY(.4em)}}
.roll{animation:roll 1.500s cubic-bezier(0.16,1,0.3,1) both}
@keyframes roll{from{transform:translateY(var(--r))}}
.note{animation:fade .6s ease-out .7s both}
@keyframes fade{from{opacity:0}}
.draw{stroke-dasharray:1;animation:draw .7s cubic-bezier(0.16,1,0.3,1) 1s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.400s ease-out infinite}
@keyframes ping{from{opacity:.55;transform:scale(1)}80%,to{opacity:0;transform:scale(2.600)}}
.nudge{animation:nudge 4s cubic-bezier(0.16,1,0.3,1) 2s infinite}@keyframes nudge{0%,82%,100%{transform:none}90%{transform:translate(2px,-2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ping{opacity:0}}
</style>
